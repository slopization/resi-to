  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          color: #687087;

      >
        영수증 기록을 불러오는 중…
      </div>
    </div>
    <script type="text/tsx" lang="tsx">
      import React, { useEffect, useMemo, useRef, useState } from "react";
      import { createRoot } from "react-dom/client";
      import {
        ReceiptText,
        CalendarDays,
        List,
        ChartNoAxesCombined,
        Plus,
        ChevronLeft,
        ChevronRight,
        ArrowUpRight,
        ArrowDownUp,
        ArrowRight,
        Upload,
        Download,
        Cloud,
        HardDrive,
        Check,
        X,
        Search,
        CreditCard,
        TrainFront,
        Banknote,
        Wallet,
        Tag,
        Pencil,
        Trash2,
        ArrowUp,
        ArrowDown,
        FileText,
        LoaderCircle,
        FolderSync,
        CheckCircle2,
        Info,
      } from "lucide-react";
      import Dexie, { liveQuery, type Table } from "dexie";
      import { twMerge } from "tailwind-merge";
      import { z } from "zod";
      import { startClxDBWithUI, type ClxDBWithUI } from "clxdb/ui";

      type PaymentMethodId = "paypay" | "ic" | "cash" | "credit";
      type EntryType = "purchase" | "transfer";
      type View = "calendar" | "list" | "stats";
      type ClassName = string | false | null | undefined;

      const cn = (...classNames: ClassName[]) =>
        twMerge(classNames.filter(Boolean).join(" "));

      type Item = {
        id: string;
        name: string;
        detail: string;
      };

      type Entry = {
        id: string;
        dayId: string;
        type: EntryType;
        order: number;
        title: string;
        merchant: string;
        amount: number;
        paymentMethod: PaymentMethodId;
        toMethod: PaymentMethodId;
        excluded: boolean;
        tags: string[];
        items: Item[];
        memo: string;
      };

      type DayRecord = {
        id: string;
        date: string;
      };

      type StoredDocument = {
        id: string;
        at: number;
        seq: number;
        del: boolean;
        data: Entry | DayRecord;
      };

      type ReplicatedDocument = Omit<StoredDocument, "seq"> & {
        seq: number | null;
      };

      type DocumentChange = {
        id: string;
        data: Entry | DayRecord;
        del?: boolean;
      };

      type EntryDocument = StoredDocument & {
        data: Entry;
      };

      type PaymentMethod = {
        id: PaymentMethodId;
        name: string;
        short: string;
        emoji: string;
        color: string;
        bg: string;
        icon: React.ElementType;
      };

      type NavigationItem = {
        view: View;
        label: string;
        icon: React.ElementType;
      };

      type EditorState = {
        entry: Entry;
        isNew: boolean;
      };

      type Confirmation = {
        title: string;
        message: string;
        action: () => Promise<void>;
      };

      class ReceiptDatabase extends Dexie {
        documents!: Table<StoredDocument, string>;

        constructor(name: string) {
          super(name);
          this.version(1).stores({ documents: "&id, seq, at" });
        }
      }

      const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
      const TAG_COLORS = [
        "#2563eb",
        "#d4d4d8",
        "#a1a1aa",
        "#71717a",
        "#52525b",
      ];
      const ENTRY_TYPE_OPTIONS: {
        type: EntryType;
        label: string;
        icon: React.ElementType;
      }[] = [
        { type: "purchase", label: "결제내역", icon: ReceiptText },
        { type: "transfer", label: "금액 이체", icon: ArrowDownUp },
      ];
      const PAYMENT_METHOD_BY_EMOJI: Record<string, PaymentMethodId> = {
        "💳": "credit",
        "💴": "cash",
        "📱": "paypay",
        "🚋": "ic",
        "🚃": "ic",
        "🚆": "ic",
      };
      const TOP_NAVIGATION: NavigationItem[] = [
        { view: "calendar", label: "영수증", icon: CalendarDays },
        { view: "stats", label: "통계", icon: ChartNoAxesCombined },
      ];
      const MOBILE_NAVIGATION: NavigationItem[] = [
        { view: "calendar", label: "캘린더", icon: CalendarDays },
        { view: "list", label: "결제내역", icon: List },
        { view: "stats", label: "통계", icon: ChartNoAxesCombined },
      ];

      const PAYMENT_METHODS: PaymentMethod[] = [
        {
          id: "paypay",
          name: "PayPay",
          short: "PayPay",
          emoji: "📱",
          color: "#d4d4d8",
          bg: "#1c1c1f",
          icon: Wallet,
        },
        {
          id: "ic",
          name: "교통 IC",
          short: "교통 IC",
          emoji: "🚋",
          color: "#a1a1aa",
          bg: "#1c1c1f",
          icon: TrainFront,
        },
        {
          id: "cash",
          name: "현금",
          short: "현금",
          emoji: "💴",
          color: "#d4d4d8",
          bg: "#1c1c1f",
          icon: Banknote,
        },
        {
          id: "credit",
          name: "신용카드",
          short: "신용카드",
          emoji: "💳",
          color: "#a1a1aa",
          bg: "#1c1c1f",
          icon: CreditCard,
        },
      ];
      function getPaymentMethod(id: string) {
        return (
          PAYMENT_METHODS.find((paymentMethod) => paymentMethod.id === id) ??
          PAYMENT_METHODS[0]
        );
      }

      const createId = () => crypto.randomUUID();

      const getErrorMessage = (error: unknown) =>
        error instanceof Error ? error.message : "알 수 없는 오류";

      const formatYen = (amount: number) =>
        `${new Intl.NumberFormat("ja-JP").format(amount)}円`;

      function getDateKey(date: Date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
      }

      const today = getDateKey(new Date());

      const parseDate = (date: string) => new Date(date + "T12:00:00");

      const getPurchaseTotal = (entries: Entry[]) =>
        entries.reduce(
          (total, entry) =>
            total +
            (entry.type === "purchase" && !entry.excluded ? entry.amount : 0),
          0,
        );

      const compareEntries = (first: Entry, second: Entry) =>
        first.order - second.order || first.id.localeCompare(second.id);

      const isValidDate = (date: string) =>
        /^\d{4}-\d{2}-\d{2}$/.test(date) &&
        !Number.isNaN(+parseDate(date)) &&
        getDateKey(parseDate(date)) === date;

      const paymentMethodIdSchema = z.enum(["paypay", "ic", "cash", "credit"]);

      const backupEntrySchema = z
        .object({
          id: z.string(),
          dayId: z.string().refine(isValidDate, "올바르지 않은 날짜입니다."),
          type: z.enum(["purchase", "transfer"]),

      function getPurchaseTotalsByDay(entries: Entry[]) {
        const totals: Record<string, number> = {};

        for (const entry of entries) {
          if (entry.type !== "purchase" || entry.excluded) continue;

          totals[entry.dayId] = (totals[entry.dayId] ?? 0) + entry.amount;
        }

        return totals;
      }

      function getTagTotals(entries: Entry[]) {
        const totals: Record<string, number> = {};

        for (const entry of entries) {
          const tags = entry.tags.length ? entry.tags : ["미분류"];

          for (const tag of tags) {
            totals[tag] = (totals[tag] ?? 0) + entry.amount;
          }
        }

        return totals;
      }

      function getEntriesByDay(entries: Entry[]) {
        const entriesByDay: Record<string, Entry[]> = {};

        for (const entry of entries) {
          (entriesByDay[entry.dayId] ??= []).push(entry);
        }

        for (const entriesForDay of Object.values(entriesByDay)) {
          entriesForDay.sort(compareEntries);
        }

        return entriesByDay;
      }

      function matchesEntryFilters(
        entry: Entry,
        paymentMethodFilter: string,
        tagFilter: string,
        searchQuery: string,
      ) {
        const matchesPaymentMethod =
          paymentMethodFilter === "all" ||
          entry.paymentMethod === paymentMethodFilter ||
          (entry.type === "transfer" && entry.toMethod === paymentMethodFilter);
        const matchesTag =
          tagFilter === "all" || entry.tags.includes(tagFilter);

        if (!matchesPaymentMethod || !matchesTag) return false;
        if (!searchQuery) return true;

        const searchableText = [
          entry.title,
          entry.merchant,
          entry.memo,
          ...entry.tags,
          ...entry.items.flatMap((item) => [item.name, item.detail]),
        ]
          .join(" ")
          .toLowerCase();

        return searchableText.includes(searchQuery);
      }

      class ReceiptBackend {
        db: ReceiptDatabase | null = null;
        listeners = new Set<() => void>();

        async initialize(storageId: string) {
          this.db?.close();
          this.db = new ReceiptDatabase("resito_clxdb_" + storageId);
          await this.db.open();
        }

        get documents() {
          if (!this.db) throw new Error("저장소가 초기화되지 않았습니다.");
          return this.db.documents;
        }

        async read(ids: string[]): Promise<(ReplicatedDocument | null)[]> {
          return (await this.documents.bulkGet(ids)).map((document) =>
            document
              ? { ...document, seq: document.seq === -1 ? null : document.seq }
              : null,
          );
        }

        async readPendingIds() {
          return this.documents.where("seq").equals(-1).primaryKeys();
        }

        async upsert(documents: ReplicatedDocument[]) {
          await this.documents.bulkPut(
            documents.map((document) => ({
              ...document,
              seq: document.seq ?? -1,
            })),
          );
        }

        async delete(documents: ReplicatedDocument[]) {
          await this.documents.bulkDelete(
            documents.map((document) => document.id),
          );
        }

        replicate(fn: () => void) {
          this.listeners.add(fn);
          return () => this.listeners.delete(fn);
        }

        async stage(changes: DocumentChange[]) {
          if (!changes.length) return;
          await this.documents.bulkPut(
            changes.map((change) => ({
              ...change,
              del: Boolean(change.del),
              at: Date.now(),
              seq: -1,
            })),
          );
          this.listeners.forEach((fn) => fn());
        }

        close() {
          this.db?.close();
          this.db = null;
        }
      }
      const backend = new ReceiptBackend();

      function parseReceipt(text: string) {
        const entries: Entry[] = [];
        const errors: string[] = [];
        let currentDate = "";
        let currentEntry: Entry | null = null;
        let isInSummary = false;
        const nextOrderByDate: Record<string, number> = {};

        text
          .replace(/\r/g, "")
          .split("\n")
          .forEach((rawLine, lineIndex) => {
            const line = rawLine.trim();
            if (!line) return;

            const heading = line.match(
              /^#\s*영수증\s*\(\s*(\d{2}|\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})\s*\)/,
            );

            if (heading) {
              currentDate = `${heading[1].length === 2 ? "20" : ""}${heading[1]}-${heading[2].padStart(2, "0")}-${heading[3].padStart(2, "0")}`;
              currentEntry = null;
              isInSummary = false;

              if (!isValidDate(currentDate)) {
                errors.push(`${lineIndex + 1}행: 올바르지 않은 날짜입니다.`);
                currentDate = "";
              }
              return;
            }

            if (/^---+$/.test(line)) {
              isInSummary = true;
              currentEntry = null;
              return;
            }

            if (
              /^=>/.test(line) ||
              /^(?:🚋|💳|💴|📱|🚃|🚆)\s*[\d,]+\s*(?:円|엔|¥)\s*$/.test(line)
            ) {
              return;
            }

            if (line.startsWith("-")) {
              if (!currentEntry || isInSummary) {
                errors.push(
                  `${lineIndex + 1}행: 항목이 속할 결제내역이 없습니다.`,
                );
                return;
              }

              const itemText = line.replace(/^-\s*/, "");
              if (!itemText) return;

              const itemDetail = itemText.match(/^(.*?)\s*\((.*)\)\s*$/);
              currentEntry.items.push({
                id: createId(),
                name: itemDetail ? itemDetail[1].trim() : itemText,
                detail: itemDetail ? itemDetail[2] : "",
              });
              return;
            }

            const purchase = line.match(
              /^(🚋|🚃|🚆|💳|💴|📱)\s*(.+?)\s*\/\/\s*([\d,]+)\s*(?:円|엔|¥)\s*$/,
            );

            if (purchase) {
              isInSummary = false;
              if (!currentDate) {
                errors.push(
                  `${lineIndex + 1}행: 먼저 #영수증 (날짜)를 입력하세요.`,
                );
                return;
              }

              const amount = Number(purchase[3].replace(/,/g, ""));
              if (!Number.isSafeInteger(amount)) {
                errors.push(`${lineIndex + 1}행: 금액이 너무 큽니다.`);
                return;
              }

              const merchant = purchase[2].match(/^(.*?)\s*\((.*)\)\s*$/);
              const title = merchant ? merchant[1].trim() : purchase[2];
              currentEntry = {
                id: createId(),
                dayId: currentDate,
                type: "purchase",
                order: nextOrderByDate[currentDate] ?? 0,
                title,
                merchant: merchant ? merchant[2] : "",
                amount,
                paymentMethod: PAYMENT_METHOD_BY_EMOJI[purchase[1]],
                toMethod: "cash",
                excluded: false,
                tags: [title],
                items: [],
                memo: "",
              };
              nextOrderByDate[currentDate] =
                (nextOrderByDate[currentDate] ?? 0) + 1;
              entries.push(currentEntry);
              return;
            }

            errors.push(
              `${lineIndex + 1}행: 인식할 수 없는 형식 — ${line.slice(0, 55)}`,
            );
          });

        if (!entries.length && !errors.length) {
          errors.push(
            "가져올 결제내역이 없습니다. 날짜와 결제내역을 입력해 주세요.",
          );
        }

        return { entries, errors };
      }

      function Modal({
        title,
        subtitle,
        children,
        onClose,
        wide = false,
      }: ModalProps) {
        const dialog = useRef<HTMLDivElement>(null);
        const closeRef = useRef(onClose);

        closeRef.current = onClose;

        useEffect(() => {
          const previouslyFocusedElement =
            document.activeElement as HTMLElement;
          const previousOverflow = document.body.style.overflow;

          document.body.style.overflow = "hidden";
          dialog.current?.focus();

          function handleKeyDown(event: KeyboardEvent) {
            if (
              Array.from(document.querySelectorAll('[role="dialog"]')).at(
                -1,
              ) !== dialog.current
            ) {
              return;
            }

            if (event.key === "Escape") {
              closeRef.current();
              return;
            }

            if (event.key === "Tab") {
              const focusableElements = Array.from(
                dialog.current?.querySelectorAll<HTMLElement>(
                  'button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]',
                ) || [],
              );
              const firstFocusableElement = focusableElements[0];
              const lastFocusableElement = focusableElements.at(-1);

              if (
                event.shiftKey &&
                (document.activeElement === firstFocusableElement ||
                  document.activeElement === dialog.current)
              ) {
                event.preventDefault();
                lastFocusableElement?.focus();
              } else if (
                !event.shiftKey &&
                (document.activeElement === lastFocusableElement ||
                  document.activeElement === dialog.current)
              ) {
                event.preventDefault();
                firstFocusableElement?.focus();
              }
            }
          }

          document.addEventListener("keydown", handleKeyDown);

          return () => {
            document.body.style.overflow = previousOverflow;
            document.removeEventListener("keydown", handleKeyDown);
            previouslyFocusedElement?.focus();
          };
        }, []);

        return (
          <div
            className="modal-shade fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6"
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              ref={dialog}
              tabIndex={-1}
              role="dialog"
              aria-modal="true"
              aria-labelledby="modal-title"
              className={cn(
                "modal-box bg-white rounded-2xl shadow-2xl w-full flex flex-col max-h-[92dvh] outline-none",
                wide ? "max-w-2xl" : "max-w-lg",
              )}
            >
              <div className="flex justify-between items-start p-5 sm:p-6 border-b border-slate-100">
                <div>
                  <h2 id="modal-title" className="text-lg font-bold">
                    {title}
                  </h2>
                  {subtitle && (
                    <p className="text-xs text-slate-400 mt-1.5">{subtitle}</p>
                  )}
                </div>
                <IconButton label="닫기" onClick={onClose}>
                  <X size={18} />
                </IconButton>
              </div>
              <div className="p-5 sm:p-6 overflow-y-auto scrollbar">
                {children}
              </div>
            </div>
          </div>
        );
      }

      function App() {
        const [ready, setReady] = useState(false);
        const [docs, setDocs] = useState<StoredDocument[]>([]);
        const [month, setMonth] = useState(today.slice(0, 7));
        const [selected, setSelected] = useState(today);
        const [view, setView] = useState<View>("calendar");
        const [search, setSearch] = useState("");
        const [filter, setFilter] = useState("all");
        const [tagFilter, setTagFilter] = useState("all");
        const [editor, setEditor] = useState<EditorState | null>(null);
        const [importOpen, setImportOpen] = useState(false);
        const [settings, setSettings] = useState(false);
        const [headerHidden, setHeaderHidden] = useState(false);
        const [busy, setBusy] = useState(false);
        const [toast, setToast] = useState("");
        const [error, setError] = useState("");
        const [revision, setRevision] = useState(0);
        const [cloud, setCloud] = useState(false);
        const [syncing, setSyncing] = useState(false);
        const [storage, setStorage] = useState("");
        const [confirmation, setConfirmation] = useState<Confirmation | null>(
          null,
        );
        const client = useRef<ClxDBWithUI | null>(null);
        const unsubs = useRef<(() => void)[]>([]);
        const [scrollTarget, setScrollTarget] = useState("");
        const storageMenuRef = useRef<HTMLDivElement>(null);

        useEffect(() => {
          if (!settings) return;

          function handlePointerDown(event: PointerEvent) {
            if (!storageMenuRef.current?.contains(event.target as Node)) {
              setSettings(false);
            }
          }

          function handleKeyDown(event: KeyboardEvent) {
            if (event.key === "Escape") setSettings(false);
          }

          document.addEventListener("pointerdown", handlePointerDown);
          document.addEventListener("keydown", handleKeyDown);
          return () => {
            document.removeEventListener("pointerdown", handlePointerDown);
            document.removeEventListener("keydown", handleKeyDown);
          };
        }, [settings]);

        useEffect(() => {
          let previousScrollY = Math.max(0, window.scrollY);

          function handleScroll() {
            const scrollY = Math.max(
              0,
              Math.min(
                window.scrollY,
                document.documentElement.scrollHeight - window.innerHeight,
              ),
            );
            if (scrollY === previousScrollY) return;

            const hidden = scrollY > 24 && scrollY > previousScrollY;
            previousScrollY = scrollY;
            setHeaderHidden(hidden);
            if (hidden) setSettings(false);
          }

          handleScroll();
          window.addEventListener("scroll", handleScroll, { passive: true });
          return () => window.removeEventListener("scroll", handleScroll);
        }, []);

        useEffect(() => {
          let active = true;

          (async () => {
            try {
              const id = localStorage.getItem("resito-storage") || "local";
              await backend.initialize(id);
              if (active) {
                setStorage(id);
                setReady(true);
              }
            } catch (caughtError) {
              if (active) {
                setError(
                  "저장소를 열지 못했습니다: " + getErrorMessage(caughtError),
                );
              }
            }
          })();
          return () => {
            active = false;
          };
        }, []);

        useEffect(() => {
          if (!ready) return;

          const subscription = liveQuery(() =>
            backend.documents.toArray(),
          ).subscribe({
            next: (documents) => setDocs(documents),
            error: (caughtError) =>
              setError(
                "기록을 읽지 못했습니다: " + getErrorMessage(caughtError),
              ),
          });
          return () => subscription.unsubscribe();
        }, [ready, revision]);

        useEffect(() => {
          if (!toast) return;

          const timer = setTimeout(() => setToast(""), 3500);
          return () => clearTimeout(timer);
        }, [toast]);

        useEffect(() => {
          if (!scrollTarget) return;

          const id = requestAnimationFrame(() => {
            document.getElementById("day-" + scrollTarget)?.scrollIntoView({
              behavior: matchMedia("(prefers-reduced-motion: reduce)").matches
                ? "instant"
                : "smooth",
              block: "start",
            });
            setScrollTarget("");
          });
          return () => cancelAnimationFrame(id);
        }, [scrollTarget, view, month]);

        const entries = useMemo(
          () =>
            docs
              .filter(
                (document): document is EntryDocument =>
                  !document.del && document.id.startsWith("entry:"),
              )
              .map((document) => document.data),
          [docs],
        );

        const monthEntries = useMemo(
          () =>
            entries
              .filter((entry) => entry.dayId.startsWith(month))
              .sort(
                (first, second) =>
                  first.dayId.localeCompare(second.dayId) ||
                  compareEntries(first, second),
              ),
          [entries, month],
        );

        const purchases = monthEntries.filter(
          (entry) => entry.type === "purchase" && !entry.excluded,
        );
        const monthTotal = getPurchaseTotal(monthEntries);
        const activeDays = new Set(purchases.map((entry) => entry.dayId)).size;

        const monthDate = parseDate(month + "-01");
        const year = monthDate.getFullYear();
        const mon = monthDate.getMonth();
        const monthDays = new Date(year, mon + 1, 0).getDate();
        const offset = new Date(year, mon, 1).getDay();

        const dayTotals = getPurchaseTotalsByDay(monthEntries);
        const tags = Array.from(
          new Set(monthEntries.flatMap((entry) => entry.tags)),
        ).sort((a, b) => a.localeCompare(b, "ko"));

        const normalizedSearch = search.toLowerCase();
        const visibleEntries = monthEntries.filter((entry) =>
          matchesEntryFilters(entry, filter, tagFilter, normalizedSearch),
        );

        const groupedEntries = useMemo(() => {
          const entriesByDay = getEntriesByDay(visibleEntries);

          if (selected.startsWith(month)) {
            entriesByDay[selected] ??= [];
          }

          return Object.entries(entriesByDay).sort(([firstDay], [secondDay]) =>
            firstDay.localeCompare(secondDay),
          );
        }, [visibleEntries, selected, month]);

        const sortedEntriesByDay = useMemo(
          () => getEntriesByDay(entries),
          [entries],
        );

        const tagTotals = getTagTotals(purchases);
        const rankedTags = Object.entries(tagTotals).sort(
          (a, b) => b[1] - a[1],
        );

        const allMonths = Array.from(
          new Set([month, ...entries.map((entry) => entry.dayId.slice(0, 7))]),
        )
          .sort()
          .reverse();
        const pending = docs.filter((document) => document.seq === -1).length;
        const remoteStorage = Boolean(storage && storage !== "local");
        const storageNeedsAttention =
          Boolean(error) || (remoteStorage && !cloud);
        const storageStatus = error
          ? `오류: ${error}`
          : remoteStorage && !cloud
            ? "저장소 연결 필요"
            : remoteStorage && pending > 0
              ? `동기화 대기 ${pending}건`
              : remoteStorage
                ? "동기화 완료"
                : "이 브라우저에 자동 저장";
        const storageLabel = `${remoteStorage ? "원격 DB" : "로컬 저장소"} · ${storageStatus}`;

        function changeMonth(value: string) {
          if (!/^\d{4}-\d{2}$/.test(value) || !isValidDate(value + "-01")) {
            return;
          }

          setMonth(value);
          setSelected(value == today.slice(0, 7) ? today : value + "-01");
          setTagFilter("all");
        }

        function stepMonth(monthOffset: number) {
          changeMonth(
            getDateKey(new Date(year, mon + monthOffset, 1)).slice(0, 7),
          );
        }

        function selectDay(day: string) {
          setSelected(day);
          setSearch("");
          setFilter("all");
          setTagFilter("all");

          if (matchMedia("(max-width: 767px)").matches) setView("list");

          setScrollTarget(day);
        }

        const notify = (message: string) => setToast(message);

        function dayChanges(days: string[]) {
          return [...new Set(days)]
            .filter(Boolean)
            .map((day) => ({ id: "day:" + day, data: { id: day, date: day } }));
        }

        async function saveEntry(entry: Entry) {
          setBusy(true);

          try {
            const old = entries.find((candidate) => candidate.id === entry.id);
            const sameDay = entries.filter(
              (candidate) =>
                candidate.dayId === entry.dayId && candidate.id !== entry.id,
            );
            const saved = {
              ...entry,
              order:
                !old || old.dayId !== entry.dayId
                  ? Math.max(
                      -1,
                      ...sameDay.map((candidate) => candidate.order),
                    ) + 1
                  : old.order,
            };

            await backend.stage([
              ...dayChanges([entry.dayId]),
              { id: "entry:" + saved.id, data: saved },
            ]);

            setMonth(entry.dayId.slice(0, 7));
            setSelected(entry.dayId);
            setEditor(null);
            notify("기록을 저장했습니다.");
          } finally {
            setBusy(false);
          }
        }

        function deleteEntry(entry: Entry) {
          setConfirmation({
            title: "이 기록을 삭제할까요?",
            message: `${entry.title} · ${formatYen(entry.amount)} 기록이 삭제됩니다.`,
            action: async () => {
              await backend.stage([
                { id: "entry:" + entry.id, data: entry, del: true },
              ]);

              setEditor(null);
              notify("기록을 삭제했습니다.");
            },
          });
        }

        async function reorder(entry: Entry, direction: number) {
          const day = entries
            .filter((candidate) => candidate.dayId === entry.dayId)
            .sort(compareEntries);
          const index = day.findIndex((candidate) => candidate.id === entry.id);
          const target = index + direction;

          if (target < 0 || target >= day.length) return;

          [day[index], day[target]] = [day[target], day[index]];

          try {
            await backend.stage(
              day.map((dayEntry, index) => ({
                id: "entry:" + dayEntry.id,
                data: { ...dayEntry, order: index },
              })),
            );
          } catch (caughtError) {
            setError(
              "순서를 바꾸지 못했습니다: " + getErrorMessage(caughtError),
            );
          }
        }

        async function importEntries(
          incoming: Entry[],
          skipDuplicates: boolean,
        ) {
          setBusy(true);

          try {
            const existingEntryCounts = new Map<string, number>();
            const nextOrderByDay: Record<string, number> = {};
            const addedEntries: Entry[] = [];

            for (const entry of entries) {
              const fingerprint = getEntryFingerprint(entry);
              const count = existingEntryCounts.get(fingerprint) ?? 0;

              existingEntryCounts.set(fingerprint, count + 1);
              nextOrderByDay[entry.dayId] = Math.max(
                nextOrderByDay[entry.dayId] ?? -1,
                entry.order,
              );
            }

            for (const entry of incoming) {
              const fingerprint = getEntryFingerprint(entry);
              const existingCount = existingEntryCounts.get(fingerprint) ?? 0;

              if (skipDuplicates && existingCount > 0) {
                existingEntryCounts.set(fingerprint, existingCount - 1);
                continue;
              }

              const nextOrder = (nextOrderByDay[entry.dayId] ?? -1) + 1;
              nextOrderByDay[entry.dayId] = nextOrder;
              addedEntries.push({
                ...entry,
                id: createId(),
                order: nextOrder,
              });
            }

            await backend.stage([
              ...dayChanges(addedEntries.map((entry) => entry.dayId)),
              ...addedEntries.map((entry) => ({
                id: "entry:" + entry.id,
                data: entry,
              })),
            ]);

            if (addedEntries.length) {
              setMonth(addedEntries[0].dayId.slice(0, 7));
              setSelected(addedEntries[0].dayId);
            }

            setImportOpen(false);
            notify(
              `${addedEntries.length}건을 가져왔습니다.${incoming.length > addedEntries.length ? ` 중복 ${incoming.length - addedEntries.length}건 제외` : ""}`,
            );
          } finally {
            setBusy(false);
          }
        }

        function exportData() {
          const content = JSON.stringify(
            {
              app: "resito",
              version: 1,
              exportedAt: new Date().toISOString(),
              entries: [...entries].sort(
                (first, second) =>
                  first.dayId.localeCompare(second.dayId) ||
                  compareEntries(first, second),
              ),
            },
            null,
            2,
          );

          const url = URL.createObjectURL(
            new Blob([content], { type: "application/json" }),
          );
          const downloadLink = document.createElement("a");

          downloadLink.href = url;
          downloadLink.download = `resito-${today}.json`;
          downloadLink.click();

          setTimeout(() => URL.revokeObjectURL(url), 1000);
          notify("전체 기록을 내보냈습니다.");
        }

        function validateBackup(data: unknown): Entry[] {
          const result = backupSchema.safeParse(data);

          if (!result.success) {
            throw new Error("백업 파일에 올바르지 않은 기록이 있습니다.");
          }

          return result.data.entries.map((entry) => ({
            ...entry,
            items: entry.items.map((item) => ({ ...item, id: createId() })),
          }));
        }

        async function restoreFile(file?: File) {
          if (!file) return;

          try {
            const restored = validateBackup(JSON.parse(await file.text()));

            setConfirmation({
              title: "백업 기록을 가져올까요?",
              message: `${restored.length}건을 현재 저장소에 추가합니다. 동일한 기록은 건너뜁니다.`,
              action: () => importEntries(restored, true),
            });
          } catch (caughtError) {
            setError("백업을 읽지 못했습니다: " + getErrorMessage(caughtError));
          }
        }

        async function connectCloud() {
          if (syncing) return;

          setSyncing(true);
          setSettings(false);

          try {
            const { startClxDBWithUI } = await import("clxdb/ui");
            const next = new ReceiptBackend();
            const clxdb = await startClxDBWithUI({
              database: next,
              ui: {
                theme: "dark",
                locale: "ko",
                style: { palette: { primaryColor: "#2563eb" } },
                syncIndicator: true,
              },
            });

            if (!clxdb) {
              next.close();
              return;
            }

            unsubs.current.forEach((fn) => fn());
            client.current?.destroy();

            if (!next.db) {
              throw new Error("동기화 저장소를 초기화하지 못했습니다.");
            }

            backend.close();
            backend.db = next.db;
            backend.listeners = next.listeners; // 두 객체가 같은 Dexie와 알림 집합을 사용합니다.

            setRevision((currentRevision) => currentRevision + 1);

                setRevision((currentRevision) => currentRevision + 1);

            ];

            notify("동기화 저장소에 연결했습니다.");

          } finally {
            setSyncing(false);
          }
        }

                            value={paymentMethod.id}
                          >
                            {paymentMethod.short}
                          </option>
                        ))}
                      </select>
                      {tags.length > 0 && (
                        <select
                          aria-label="태그 필터"
                          className="!w-[100px] !text-xs !p-2 h-10 !rounded-lg"
                          value={tagFilter}
                          onChange={(e) => setTagFilter(e.target.value)}
                        >
                          <option value="all">모든 태그</option>
                          {tags.map((tag) => (
                            <option key={tag} value={tag}>
                              {tag}
                            </option>
                          ))}
                        </select>
                      )}
                    </div>
                    {!ready ? (
                      <div className="panel p-12 text-center text-slate-400 text-xs">
                        저장소를 불러오는 중…
                      </div>
                    ) : (
                      groupedEntries.map(([day, dayEntries]) => {
                        const allDayEntries = sortedEntriesByDay[day] ?? [];
                        const date = parseDate(day);
                        const firstEntryId = allDayEntries[0]?.id;
                        const lastEntryId = allDayEntries.at(-1)?.id;

                        return (
                          <section
                            key={day}
                            id={"day-" + day}
                            className="day-section mb-7"
                          >
                            <div className="flex justify-between items-center mb-3">
                              <div className="flex items-center gap-2">
                                <span
                                  className={cn(
                                    "w-8 h-8 flex items-center justify-center rounded-lg font-semibold num text-[15px]",
                                    day === selected
                                      ? "bg-blue-100 text-brand"
                                      : "bg-[#eceff4] text-slate-500",
                                  )}
                                >
                                  {date.getDate()}
                                </span>
                                <h4 className="text-xs font-semibold">
                                  {mon + 1}월 {date.getDate()}일{" "}
                                  <span className="text-slate-400 font-normal ml-1">
                                    {WEEKDAYS[date.getDay()]}
                                    요일
                                  </span>
                                </h4>
                                {day === today && (
                                  <span className="text-[11px] font-semibold text-brand bg-blue-50 rounded px-1.5 py-0.5">
                                    오늘
                                  </span>
                                )}
                              </div>
                              <div className="flex items-center gap-1">
                                <span className="num font-semibold text-sm mr-1">
                                  {formatYen(getPurchaseTotal(allDayEntries))}
                                </span>
                                <IconButton
                                  label={`${day} 기록 추가`}
                                  onClick={() =>
                                    setEditor({
                                      entry: blankEntry(day),
                                      isNew: true,
                                    })
                                  }
                                >
                                  <Plus size={14} />
                                </IconButton>
                              </div>
                            </div>
                            <div className="space-y-2.5">
                              {dayEntries.length ? (
                                dayEntries.map((entry) => (
                                  <EntryCard
                                    key={entry.id}
                                    entry={entry}
                                    onEdit={() =>
                                      setEditor({ entry, isNew: false })
                                    }
                                    onReorder={reorder}
                                    first={entry.id === firstEntryId}
                                    last={entry.id === lastEntryId}
                                  />
                                ))
                              ) : (
                                <div className="panel px-5 py-9 text-center">
                                  <ReceiptText
                                    size={26}
                                    strokeWidth={1.2}
                                    className="mx-auto text-slate-300 mb-3"
                                  />
                                  <p className="text-xs text-slate-400">
                                    {allDayEntries.length
                                      ? "필터에 맞는 기록이 없습니다."
                                      : "아직 기록이 없는 하루예요."}
                                  </p>
                                  {!allDayEntries.length && (
                                    <button
                                      onClick={() =>
                                        setEditor({
                                          entry: blankEntry(day),
                                          isNew: true,
                                        })
                                      }
                                      className="text-[11px] text-brand mt-3"
                                    >
                                      첫 영수증 기록하기 +
                                    </button>
                                  )}
                                </div>
                              )}
                            </div>
                            {dayEntries.length > 0 && (
                              <div className="flex flex-wrap gap-x-4 gap-y-1 justify-end mt-3 pr-1">
                                {PAYMENT_METHODS.filter((paymentMethod) =>
                                  allDayEntries.some(
                                    (entry) =>
                                      entry.type === "purchase" &&
                                      !entry.excluded &&
                                      entry.paymentMethod === paymentMethod.id,
                                  ),
                                ).map((paymentMethod) => (
                                  <span
                                    key={paymentMethod.id}
                                    className="text-[9px] text-slate-400 flex items-center gap-1"
                                  >
                                    <paymentMethod.icon size={10} />
                                    {paymentMethod.short}
                                    <span className="num ml-1">
                                      {formatYen(
                                        getPurchaseTotal(
                                          allDayEntries.filter(
                                            (entry) =>
                                              entry.paymentMethod ===
                                              paymentMethod.id,
                                          ),
                                        ),
                                      )}
                                    </span>
                                  </span>
                                ))}
                              </div>
                            )}
                          </section>
                        );
                      })
                    )}
                    {ready && !monthEntries.length && (
                      <div className="mt-5 rounded-xl border border-dashed border-slate-200 px-5 py-5 flex items-center gap-3">
                        <Upload size={19} className="text-slate-400" />
                        <div className="flex-1">
                          <p className="text-xs text-slate-500">
                            텍스트로 기록해 둔 영수증이 있나요?
                          </p>
                          <button
                            onClick={() => setImportOpen(true)}
                            className="text-[11px] text-brand mt-1.5"
                          >
                            텍스트 가져오기로 시작하기 →
                          </button>
                        </div>
                      </div>
                    )}
                  </section>
                </div>
              )}
            </main>
            <nav
              aria-label="모바일 메뉴"
              className="mobile-nav md:hidden fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 flex justify-around pt-3"
            >
              {MOBILE_NAVIGATION.map(
                ({ view: navigationView, label, icon: Icon }) => (
                  <button
                    key={navigationView}
                    onClick={() => setView(navigationView)}
                    className={cn(
                      "flex flex-col items-center gap-1 w-20 text-[10px]",
                      view === navigationView
                        ? "text-brand font-semibold"
                        : "text-slate-400",
                    )}
                    aria-current={view === navigationView ? "page" : undefined}
                  >
                    <Icon
                      size={20}
                      strokeWidth={view === navigationView ? 2 : 1.6}
                    />
                    {label}
                  </button>
                ),
              )}
              <button
                onClick={() => setImportOpen(true)}
                className="flex flex-col items-center gap-1 w-20 text-[10px] text-slate-400"
              >
                <Upload size={20} strokeWidth={1.6} />
                가져오기
              </button>
            </nav>
            {toast && (
              <div
                role="status"
                className="toast fixed z-[80] bottom-24 md:bottom-7 left-1/2 -translate-x-1/2 flex items-center gap-2 text-white text-xs px-5 py-3.5 rounded-lg shadow-xl max-w-[90vw]"
              >
                <CheckCircle2 size={15} className="text-brand shrink-0" />
                {toast}
              </div>
            )}
            {syncing && (
              <div
                role="status"
                className="fixed bottom-24 right-4 bg-white panel shadow-lg p-3 flex items-center gap-2 text-xs z-[70]"
              >
                <LoaderCircle size={15} className="animate-spin text-brand" />
                저장소 연결 / 동기화 중…
              </div>
            )}
            {editor && (
              <EntryEditor
                entry={editor.entry}
                isNew={editor.isNew}
                onClose={() => setEditor(null)}
                onSave={saveEntry}
                onDelete={deleteEntry}
                busy={busy}
              />
            )}
            {importOpen && (
              <ImportDialog
                onClose={() => setImportOpen(false)}
                onImport={importEntries}
                busy={busy}
              />
            )}
            {confirmation && (
              <Modal
                title={confirmation.title}
                onClose={() => !busy && setConfirmation(null)}
              >
                <p className="text-sm text-slate-500 leading-7">
                  {confirmation.message}
                </p>
                <div className="flex justify-end gap-2 mt-6">
                  <button
                    className="btn"
                    disabled={busy}
                    onClick={() => setConfirmation(null)}
                  >
                    취소
                  </button>
                  <button
                    className="btn primary"
                    disabled={busy}
                    onClick={async () => {
                      setBusy(true);
                      try {
                        await confirmation.action();
                        setConfirmation(null);
                      } catch (caughtError) {
                        setError(getErrorMessage(caughtError));
                        setConfirmation(null);
                      } finally {
                        setBusy(false);
                      }
                    }}
                  >
                    확인
                  </button>
                </div>
              </Modal>
            )}
          </div>
        );
      }

      type SummaryCardProps = {
        label: string;
        value: React.ReactNode;
        icon: React.ElementType;
      };

      function SummaryCard({ label, value, icon: Icon }: SummaryCardProps) {
        return (
          <div className="panel p-5 min-h-[140px]">
            <p className="text-xs font-medium text-slate-600 flex justify-between items-center">
              {label}
              <Icon size={16} className="text-blue-600" strokeWidth={2} />
            </p>
            <p className="num text-[26px] sm:text-[29px] font-bold mt-4 leading-none">
              {value}
            </p>
          </div>
        );
      }
      function Empty({ text }: { text: string }) {
        return (
          <div className="text-center text-xs text-slate-400 py-12 leading-6">
            <ChartNoAxesCombined
              size={26}
              className="mx-auto mb-3 text-slate-300"
            />
            {text}
          </div>
        );
      }
      type EntryCardProps = {
        entry: Entry;
        onEdit: () => void;
        onReorder: (entry: Entry, direction: number) => Promise<void>;
        first: boolean;
        last: boolean;
      };

      function EntryCard({
        entry,
        onEdit,
        onReorder,
        first,
        last,
      }: EntryCardProps) {
        const isTransfer = entry.type === "transfer";
        return (
          <article
            className={cn(
              "entry-card panel !rounded-xl px-4 sm:px-5 py-4",
              entry.excluded && "opacity-65",
            )}
          >
            <div className="flex items-start gap-3">
              <span
                className={cn(
                  "w-9 h-9 rounded-xl flex items-center justify-center shrink-0",
                  isTransfer
                    ? "bg-slate-100 text-slate-600"
                    : "bg-blue-50 text-blue-600",
                )}
              >
                {isTransfer ? (
                  <ArrowDownUp size={18} strokeWidth={1.7} />
                ) : (
                  <ReceiptText size={18} strokeWidth={1.7} />
                )}
              </span>
              <div className="min-w-0 flex-1">
                <div className="flex items-start justify-between gap-2">
                  <button onClick={onEdit} className="text-left min-w-0">
                    <h5 className="text-sm font-semibold leading-5 break-words">
                      {entry.title}{" "}
                      {entry.merchant && (
                        <span className="text-xs font-medium text-slate-500 ml-1">
                          {entry.merchant}
                        </span>
                      )}
                    </h5>
                  </button>
                  <span
                    className={cn(
                      "text-[15px] num font-bold whitespace-nowrap leading-5",
                      entry.excluded
                        ? "text-slate-400"
                        : isTransfer && "text-[#7a8da6]",
                    )}
                  >
                    {formatYen(entry.amount)}
                  </span>
                </div>
                <div className="flex flex-wrap gap-1.5 mt-2 items-center">
                  <PaymentBadge id={entry.paymentMethod} />
                  {isTransfer && (
                    <>
                      <ArrowRight size={11} className="text-slate-400" />
                      <PaymentBadge id={entry.toMethod} />
                      <span className="pill bg-slate-100 text-slate-400">
                        이체
                      </span>
                    </>
                  )}
                  {entry.excluded && (
                    <span className="pill bg-slate-100 text-slate-400">
                      합계 제외
                    </span>
                  )}
                  {entry.tags.map((tag) => (
                    <span
                      key={tag}
                      className="text-xs font-medium text-slate-500 ml-0.5"
                    >
                      #{tag}
                    </span>
                  ))}
                </div>
                {entry.items.length > 0 && (
                  <ul className="mt-3 space-y-1.5 border-l border-slate-200 pl-3 list-none">
                    {entry.items.map((item) => (
                      <li
                        key={item.id}
                        className="text-xs text-slate-600 leading-5 break-words"
                      >
                        {item.name}
                        {item.detail && (
                          <span className="text-slate-400 ml-1">
                            ({item.detail})
                          </span>
                        )}
                      </li>
                    ))}
                  </ul>
                )}
                {entry.memo && (
                  <p className="text-xs text-slate-500 leading-5 mt-2 whitespace-pre-wrap break-words">
                    {entry.memo}
                  </p>
                )}
              </div>
            </div>
            <div className="flex justify-end mt-1 -mb-1 -mr-1">
              <IconButton
                label="위로 이동"
                disabled={first}
                onClick={() => onReorder(entry, -1)}
              >
                <ArrowUp size={12} />
              </IconButton>
              <IconButton
                label="아래로 이동"
                disabled={last}
                onClick={() => onReorder(entry, 1)}
              >
                <ArrowDown size={12} />
              </IconButton>
              <IconButton label="기록 수정" onClick={onEdit}>
                <Pencil size={12} />
              </IconButton>
            </div>
          </article>
        );
      }

      createRoot(document.getElementById("root")!).render(<App />);
    </script>
    <script type="module" src="https://esm.sh/tsx"></script>
  </body>
</html>
