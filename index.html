      type PaymentMethodId = "paypay" | "ic" | "cash" | "credit";
      type EntryType = "purchase" | "transfer";
      type View = "calendar" | "list" | "stats";
      type ClassName = string | false | null | undefined;

        documents!: Table<StoredDocument, string>;

        constructor(name: string) {

      const PAYMENT_METHODS: PaymentMethod[] = [
        {
          id: "paypay",
          name: "PayPay",
          short: "PayPay",
          emoji: "📱",
          color: "#e36b72",
          bg: "#fff0f1",
          icon: Wallet,

        {

          name: "Transportation IC",

          emoji: "🚋",
          color: "#459e86",
          bg: "#ecf7f1",
          icon: TrainFront,
        },
        {
          id: "cash",
          name: "Cash",
          short: "현금",
          emoji: "💴",
          color: "#bf9552",
          bg: "#faf4e9",
          icon: Banknote,
        },
        {
          id: "credit",
          name: "Credit Card",
          short: "신용카드",
          emoji: "💳",
          color: "#7b79c6",
          bg: "#f1f0fb",
          icon: CreditCard,
        },

      function getPaymentMethod(id: string) {
        return (
          PAYMENT_METHODS.find((paymentMethod) => paymentMethod.id === id) ??
          PAYMENT_METHODS[0]
        );
      }

      const createId = () => crypto.randomUUID();

      const getErrorMessage = (error: unknown) =>
        error instanceof Error ? error.message : "알 수 없는 오류";

      const formatYen = (amount: number) =>
        `${new Intl.NumberFormat("ja-JP").format(amount)}円`;

      function getDateKey(date: Date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
      }

      const today = getDateKey(new Date());

      const parseDate = (date: string) => new Date(date + "T12:00:00");

      const getPurchaseTotal = (entries: Entry[]) =>
        entries.reduce(
          (total, entry) =>
            total +
            (entry.type === "purchase" && !entry.excluded ? entry.amount : 0),
          0,
        );

      const compareEntries = (first: Entry, second: Entry) =>
        first.order - second.order || first.id.localeCompare(second.id);

      const isValidDate = (date: string) =>
        /^\d{4}-\d{2}-\d{2}$/.test(date) &&
        !Number.isNaN(+parseDate(date)) &&
        getDateKey(parseDate(date)) === date;

      const paymentMethodIdSchema = z.enum(["paypay", "ic", "cash", "credit"]);

      const backupEntrySchema = z
        .object({
          id: z.string(),
          dayId: z.string().refine(isValidDate, "올바르지 않은 날짜입니다."),
          type: z.enum(["purchase", "transfer"]),
          order: z.number().finite(),
          title: z.string(),
          merchant: z.string(),
          amount: z.number().int().positive().safe(),
          paymentMethod: paymentMethodIdSchema,
          toMethod: paymentMethodIdSchema,
          excluded: z.boolean(),
          tags: z.array(z.string()),
          items: z.array(
            z.object({
              name: z.string(),
              detail: z.string(),
            }),
          ),
          memo: z.string(),
        })
        .superRefine((entry, context) => {
          if (
            entry.type === "transfer" &&
            entry.paymentMethod === entry.toMethod
          ) {
            context.addIssue({
              code: z.ZodIssueCode.custom,
              path: ["toMethod"],
              message: "이체 결제수단은 서로 달라야 합니다.",
            });
          }
        });

      const backupSchema = z.object({
        app: z.literal("resito"),
        version: z.literal(1),
        exportedAt: z.string().datetime(),
        entries: z.array(backupEntrySchema),
      });

      function getPurchaseTotalsByDay(entries: Entry[]) {
        const totals: Record<string, number> = {};

        for (const entry of entries) {
          if (entry.type !== "purchase" || entry.excluded) continue;

          totals[entry.dayId] = (totals[entry.dayId] ?? 0) + entry.amount;
        }

        return totals;
      }

      function getTagTotals(entries: Entry[]) {
        const totals: Record<string, number> = {};

        for (const entry of entries) {
          const tags = entry.tags.length ? entry.tags : ["미분류"];

          for (const tag of tags) {
            totals[tag] = (totals[tag] ?? 0) + entry.amount;
          }
        }

        return totals;
      }

      function getEntriesByDay(entries: Entry[]) {
        const entriesByDay: Record<string, Entry[]> = {};

        for (const entry of entries) {
          (entriesByDay[entry.dayId] ??= []).push(entry);
        }

        for (const entriesForDay of Object.values(entriesByDay)) {
          entriesForDay.sort(compareEntries);
        }

        return entriesByDay;
      }

      function matchesEntryFilters(
        entry: Entry,
        paymentMethodFilter: string,
        tagFilter: string,
        searchQuery: string,
      ) {
        const matchesPaymentMethod =
          paymentMethodFilter === "all" ||
          entry.paymentMethod === paymentMethodFilter ||
          (entry.type === "transfer" && entry.toMethod === paymentMethodFilter);
        const matchesTag =
          tagFilter === "all" || entry.tags.includes(tagFilter);

        if (!matchesPaymentMethod || !matchesTag) return false;
        if (!searchQuery) return true;

        const searchableText = [
          entry.title,
          entry.merchant,
          entry.memo,
          ...entry.tags,
          ...entry.items.flatMap((item) => [item.name, item.detail]),
        ]
          .join(" ")
          .toLowerCase();

        return searchableText.includes(searchQuery);
      }

      function getEntryFingerprint(entry: Entry) {
        return JSON.stringify({
          dayId: entry.dayId,
          type: entry.type,
          title: entry.title,
          merchant: entry.merchant,
          amount: entry.amount,
          paymentMethod: entry.paymentMethod,
          toMethod: entry.toMethod,
          excluded: entry.excluded,
          tags: [...entry.tags].sort(),
          items: entry.items.map((item) => ({
            name: item.name,
            detail: item.detail,
          })),
          memo: entry.memo,
        });
      }

      const RECEIPT_EXAMPLE = `#영수증 (26.09.27)

            🚋 편의점 (LAWSON) // 1,031円
                  - 도시락 (오니기리 벤또)
                  - 주먹밥 (구! 오니기리 포크타마고)
                  - 탄산수 (윌킨슨 레몬 500mL)

            🚋 교통 (린카이선) // 272円
                  - 시나가와 시사이드 → 오사키

            🚋 생활용품 (Seria) // 330円
                  - 파일 케이스 (A4 패스너 케이스 검은색)
                  - 클리어 홀더 (A4 클리어 홀더 고투명 4매)
                  - 포켓티슈 (미니미니 포켓티슈 모후모후)

            🚋 교통 (린카이선) // 272円
                  - 오사키 → 시나가와 시사이드

            🚋 저녁 (松屋) // 460円
                  - 규동 (牛めし 並盛)

            ---

            🚋 2,365円
            💳 0円
            💴 0円

            => 2,365円`;

      // IndexedDB에는 null 인덱스 대신 -1을 저장하고, clxdb 경계에서 null로 변환합니다.
      class ReceiptBackend {
        db: ReceiptDatabase | null = null;
        listeners = new Set<() => void>();

        async initialize(storageId: string) {
          this.db?.close();
          this.db = new ReceiptDatabase("resito_clxdb_" + storageId);
          await this.db.open();
        }

        get documents() {
          if (!this.db) throw new Error("저장소가 초기화되지 않았습니다.");
          return this.db.documents;
        }

        async read(ids: string[]): Promise<(ReplicatedDocument | null)[]> {
          return (await this.documents.bulkGet(ids)).map((document) =>
            document
              ? { ...document, seq: document.seq === -1 ? null : document.seq }
              : null,
          );
        }

        async readPendingIds() {
          return this.documents.where("seq").equals(-1).primaryKeys();
        }

        async upsert(documents: ReplicatedDocument[]) {
          await this.documents.bulkPut(
            documents.map((document) => ({
              ...document,
              seq: document.seq ?? -1,
            })),
          );
        }

        async delete(documents: ReplicatedDocument[]) {
          await this.documents.bulkDelete(
            documents.map((document) => document.id),
          );
        }

        replicate(fn: () => void) {
          this.listeners.add(fn);
          return () => this.listeners.delete(fn);
        }

        async stage(changes: DocumentChange[]) {
          if (!changes.length) return;
          await this.documents.bulkPut(
            changes.map((change) => ({
              ...change,
              del: Boolean(change.del),
              at: Date.now(),
              seq: -1,
            })),
          );
          this.listeners.forEach((fn) => fn());
        }

        close() {
          this.db?.close();
          this.db = null;
        }
      }
      const backend = new ReceiptBackend();

      function parseReceipt(text: string) {
        const entries: Entry[] = [];
        const errors: string[] = [];
        let currentDate = "";
        let currentEntry: Entry | null = null;
        let isInSummary = false;
        const nextOrderByDate: Record<string, number> = {};

        text
          .replace(/\r/g, "")
          .split("\n")
          .forEach((rawLine, lineIndex) => {
            const line = rawLine.trim();
            if (!line) return;

            const heading = line.match(
              /^#\s*영수증\s*\(\s*(\d{2}|\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})\s*\)/,
            );

            if (heading) {
              currentDate = `${heading[1].length === 2 ? "20" : ""}${heading[1]}-${heading[2].padStart(2, "0")}-${heading[3].padStart(2, "0")}`;
              currentEntry = null;
              isInSummary = false;

              if (!isValidDate(currentDate)) {
                errors.push(`${lineIndex + 1}행: 올바르지 않은 날짜입니다.`);
                currentDate = "";
              }
              return;
            }

            if (/^---+$/.test(line)) {
              isInSummary = true;
              currentEntry = null;
              return;
            }

            if (
              /^=>/.test(line) ||
              /^(?:🚋|💳|💴|📱|🚃|🚆)\s*[\d,]+\s*(?:円|엔|¥)\s*$/.test(line)
            ) {
              return;
            }

            if (line.startsWith("-")) {
              if (!currentEntry || isInSummary) {
                errors.push(
                  `${lineIndex + 1}행: 항목이 속할 결제내역이 없습니다.`,
                );
                return;
              }

              const itemText = line.replace(/^-\s*/, "");
              if (!itemText) return;

              const itemDetail = itemText.match(/^(.*?)\s*\((.*)\)\s*$/);
              currentEntry.items.push({
                id: createId(),
                name: itemDetail ? itemDetail[1].trim() : itemText,
                detail: itemDetail ? itemDetail[2] : "",
              });
              return;
            }

            const purchase = line.match(
              /^(🚋|🚃|🚆|💳|💴|📱)\s*(.+?)\s*\/\/\s*([\d,]+)\s*(?:円|엔|¥)\s*$/,
            );

            if (purchase) {
              isInSummary = false;
              if (!currentDate) {
                errors.push(
                  `${lineIndex + 1}행: 먼저 #영수증 (날짜)를 입력하세요.`,
                );
                return;
              }

              const amount = Number(purchase[3].replace(/,/g, ""));
              if (!Number.isSafeInteger(amount)) {
                errors.push(`${lineIndex + 1}행: 금액이 너무 큽니다.`);
                return;
              }

              const merchant = purchase[2].match(/^(.*?)\s*\((.*)\)\s*$/);
              const title = merchant ? merchant[1].trim() : purchase[2];
              currentEntry = {
                id: createId(),
                dayId: currentDate,
                type: "purchase",
                order: nextOrderByDate[currentDate] ?? 0,
                title,
                merchant: merchant ? merchant[2] : "",
                amount,
                paymentMethod: PAYMENT_METHOD_BY_EMOJI[purchase[1]],
                toMethod: "cash",
                excluded: false,
                tags: [title],
                items: [],
                memo: "",
              };
              nextOrderByDate[currentDate] =
                (nextOrderByDate[currentDate] ?? 0) + 1;
              entries.push(currentEntry);
              return;
            }

            errors.push(
              `${lineIndex + 1}행: 인식할 수 없는 형식 — ${line.slice(0, 55)}`,
            );
          });

        if (!entries.length && !errors.length) {
          errors.push(
            "가져올 결제내역이 없습니다. 날짜와 결제내역을 입력해 주세요.",
          );
        }

        return { entries, errors };
      }

      type ModalProps = {
        title: string;
        subtitle?: string;

        wide?: boolean;
      };

      function Modal({
        title,
        subtitle,
        children,
        onClose,
        wide = false,
      }: ModalProps) {
        const dialog = useRef<HTMLDivElement>(null);
        const closeRef = useRef(onClose);

        closeRef.current = onClose;

        useEffect(() => {
          const previouslyFocusedElement =
            document.activeElement as HTMLElement;
          const previousOverflow = document.body.style.overflow;

          document.body.style.overflow = "hidden";
          dialog.current?.focus();

          function handleKeyDown(event: KeyboardEvent) {
            if (
              Array.from(document.querySelectorAll('[role="dialog"]')).at(
                -1,
              ) !== dialog.current
            ) {
              return;
            }

            if (event.key === "Escape") {
              closeRef.current();
              return;
            }

            if (event.key === "Tab") {
              const focusableElements = Array.from(
                dialog.current?.querySelectorAll<HTMLElement>(
                  'button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]',
                ) || [],
              );
              const firstFocusableElement = focusableElements[0];
              const lastFocusableElement = focusableElements.at(-1);

              if (
                event.shiftKey &&
                (document.activeElement === firstFocusableElement ||
                  document.activeElement === dialog.current)
              ) {
                event.preventDefault();
                lastFocusableElement?.focus();
              } else if (
                !event.shiftKey &&
                (document.activeElement === lastFocusableElement ||
                  document.activeElement === dialog.current)
              ) {
                event.preventDefault();
                firstFocusableElement?.focus();
              }
            }
          }

          document.addEventListener("keydown", handleKeyDown);

          return () => {
            document.body.style.overflow = previousOverflow;
            document.removeEventListener("keydown", handleKeyDown);
            previouslyFocusedElement?.focus();
          };
        }, []);

        return (
          <div
            className="modal-shade fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6"
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              ref={dialog}
              tabIndex={-1}
              role="dialog"
              aria-modal="true"
              aria-labelledby="modal-title"
              className={cn(
                "modal-box bg-white rounded-2xl shadow-2xl w-full flex flex-col max-h-[92dvh] outline-none",
                wide ? "max-w-2xl" : "max-w-lg",
              )}
            >
              <div className="flex justify-between items-start p-5 sm:p-6 border-b border-slate-100">
                <div>
                  <h2 id="modal-title" className="text-lg font-bold">
                    {title}
                  </h2>
                  {subtitle && (
                    <p className="text-xs text-slate-400 mt-1.5">{subtitle}</p>
                  )}
                </div>
                <IconButton label="닫기" onClick={onClose}>
                  <X size={18} />
                </IconButton>
              </div>
              <div className="p-5 sm:p-6 overflow-y-auto scrollbar">
                {children}
              </div>
            </div>
          </div>
        );
      }

      type EntryEditorProps = {

        busy: boolean;

        entry,
        isNew,
        onClose,
        onSave,
        onDelete,
        busy,

        const [form, setForm] = useState<Entry>(structuredClone(entry));
        const [tagText, setTagText] = useState(entry.tags.join(", "));
        const [error, setError] = useState("");

        function updateForm<Key extends keyof Entry>(
          key: Key,
          value: Entry[Key],
        ) {
          setForm((currentForm) => ({ ...currentForm, [key]: value }));
        }

        function changeItem(
          itemId: string,
          key: "name" | "detail",
          value: string,
        ) {
          updateForm(
            "items",
            form.items.map((item) =>
              item.id === itemId ? { ...item, [key]: value } : item,
            ),
          );
        }

        async function submit(event: React.FormEvent<HTMLFormElement>) {
          event.preventDefault();
          setError("");

          if (!isValidDate(form.dayId)) {
            setError("올바른 날짜를 입력해 주세요.");
            return;
          }

          if (!Number.isSafeInteger(form.amount) || form.amount <= 0) {
            setError("금액은 1엔 이상의 정수로 입력해 주세요.");
            return;
          }

          if (
            form.type === "transfer" &&
            form.paymentMethod === form.toMethod
          ) {
            setError("서로 다른 결제수단을 선택해 주세요.");
            return;
          }

          try {
            await onSave({
              ...form,
              title:
                form.title.trim() ||
                (form.type === "transfer" ? "금액 이체" : ""),
              merchant: form.merchant.trim(),
              tags: [
                ...new Set(
                  tagText
                    .split(/[,#\n]/)
                    .map((tag) => tag.trim())
                    .filter(Boolean),
                ),
              ],
              items: form.items
                .filter((item) => item.name.trim())
                .map((item) => ({
                  ...item,
                  name: item.name.trim(),
                  detail: item.detail.trim(),
                })),
            });
          } catch (caughtError) {
            setError("저장하지 못했습니다. " + getErrorMessage(caughtError));
          }
        }
        return (
          <Modal
            title={isNew ? "새 기록 추가" : "기록 수정"}
            subtitle="작은 지출부터, 하루의 모든 기록을 남겨보세요."

                    {label}

                  <label htmlFor="entry-date">날짜</label>

                    onChange={(event) =>
                      updateForm("dayId", event.target.value)
                    }
                  />
                </div>
                <div>
                  <label htmlFor="entry-amount">금액 (円)</label>

                    type="number"
                    min="1"
                    step="1"
                    inputMode="numeric"
                    required
                    value={form.amount || ""}
                    onChange={(event) =>
                      updateForm("amount", Number(event.target.value))
                    }
                    placeholder="0"
                  />
                </div>
              </div>
              <div>
                <label htmlFor="entry-title">
                  {form.type === "purchase" ? "내역 이름" : "이체 이름 (선택)"}
                </label>
                <input
                  id="entry-title"
                  required={form.type === "purchase"}
                  value={form.title}
                  onChange={(event) => updateForm("title", event.target.value)}
                  placeholder={
                    form.type === "purchase"
                      ? "예: 편의점, 저녁, 교통"
                      : "예: 교통카드 충전"
                  }
                />
              </div>
              {form.type === "purchase" && (
                <div>

                      <Plus size={13} />

                  </div>
                  <div className="space-y-2">
                    {form.items.map((item, i) => (
                      <div className="flex items-start gap-1" key={item.id}>
                        <div className="flex-1 grid grid-cols-2 gap-2">
                          <input
                            aria-label={`${i + 1}번째 항목명`}

                          />
                          <input

                            value={item.detail}
                            onChange={(e) =>
                              changeItem(item.id, "detail", e.target.value)
                            }
                          />

                        <IconButton
                          label="항목 삭제"
                          onClick={() =>

                        >
                          <X size={15} />
                        </IconButton>
                      </div>
                    ))}
                    {!form.items.length && (
                      <button
                        type="button"
                        onClick={() =>
                          updateForm("items", [
                            { id: createId(), name: "", detail: "" },
                          ])
                        }

                      >
                        + 구매한 항목을 추가하세요
                      </button>
                    )}
                  </div>
                </div>
              )}
              <div>
                <label htmlFor="tags">
                  태그 <span className="muted font-normal">· 쉼표로 구분</span>
                </label>
                <input
                  id="tags"
                  value={tagText}
                  onChange={(e) => setTagText(e.target.value)}

                />
              </div>
              <div>
                <label htmlFor="memo">메모</label>
                <textarea
                  id="memo"
                  rows={2}
                  value={form.memo}
                  onChange={(event) => updateForm("memo", event.target.value)}
                  placeholder="기억하고 싶은 내용을 남겨보세요."
                />
              </div>
              {form.type === "purchase" ? (
                <label className="flex items-center gap-2.5 rounded-xl bg-slate-50 p-3 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={form.excluded}
                    onChange={(event) =>
                      updateForm("excluded", event.target.checked)
                    }
                  />
                  <span>
                    지출 합계에서 제외{" "}

        const [confirmation, setConfirmation] = useState<Confirmation | null>(
          null,
        );
        const client = useRef<ClxDBWithUI | null>(null);
        const unsubs = useRef<(() => void)[]>([]);
        const [scrollTarget, setScrollTarget] = useState("");

        useEffect(() => {
          let active = true;

          (async () => {
            try {
              const id = localStorage.getItem("resito-storage") || "local";
              await backend.initialize(id);
              if (active) {
                setStorage(id);
                setReady(true);
              }
            } catch (caughtError) {
              if (active) {
                setError(
                  "저장소를 열지 못했습니다: " + getErrorMessage(caughtError),
                );
              }
            }
          })();
          return () => {
            active = false;
          };
        }, []);

        useEffect(() => {
          if (!ready) return;

          const subscription = liveQuery(() =>
            backend.documents.toArray(),
          ).subscribe({
            next: (documents) => setDocs(documents),
            error: (caughtError) =>
              setError(
                "기록을 읽지 못했습니다: " + getErrorMessage(caughtError),
              ),
          });
          return () => subscription.unsubscribe();
        }, [ready, revision]);

        useEffect(() => {
          if (!toast) return;

          const timer = setTimeout(() => setToast(""), 3500);
          return () => clearTimeout(timer);
        }, [toast]);

        useEffect(() => {
          if (!scrollTarget) return;

          const id = requestAnimationFrame(() => {
            document.getElementById("day-" + scrollTarget)?.scrollIntoView({
              behavior: matchMedia("(prefers-reduced-motion: reduce)").matches
                ? "instant"
                : "smooth",
              block: "start",
            });
            setScrollTarget("");
          });
          return () => cancelAnimationFrame(id);
        }, [scrollTarget, view, month]);

        const entries = useMemo(
          () =>
            docs
              .filter(
                (document): document is EntryDocument =>
                  !document.del && document.id.startsWith("entry:"),
              )
              .map((document) => document.data),
          [docs],
        );

        const monthEntries = useMemo(
          () =>
            entries
              .filter((entry) => entry.dayId.startsWith(month))
              .sort(
                (first, second) =>
                  first.dayId.localeCompare(second.dayId) ||
                  compareEntries(first, second),
              ),
          [entries, month],
        );

        const purchases = monthEntries.filter(
          (entry) => entry.type === "purchase" && !entry.excluded,
        );
        const monthTotal = getPurchaseTotal(monthEntries);
        const activeDays = new Set(purchases.map((entry) => entry.dayId)).size;

        const monthDate = parseDate(month + "-01");
        const year = monthDate.getFullYear();
        const mon = monthDate.getMonth();
        const monthDays = new Date(year, mon + 1, 0).getDate();
        const offset = new Date(year, mon, 1).getDay();

        const dayTotals = getPurchaseTotalsByDay(monthEntries);
        const tags = Array.from(
          new Set(monthEntries.flatMap((entry) => entry.tags)),
        ).sort((a, b) => a.localeCompare(b, "ko"));

        const normalizedSearch = search.toLowerCase();
        const visibleEntries = monthEntries.filter((entry) =>
          matchesEntryFilters(entry, filter, tagFilter, normalizedSearch),
        );

        const groupedEntries = useMemo(() => {
          const entriesByDay = getEntriesByDay(visibleEntries);

          if (selected.startsWith(month)) {
            entriesByDay[selected] ??= [];
          }

          return Object.entries(entriesByDay).sort(([firstDay], [secondDay]) =>
            firstDay.localeCompare(secondDay),
          );
        }, [visibleEntries, selected, month]);

        const sortedEntriesByDay = useMemo(
          () => getEntriesByDay(entries),
          [entries],
        );

        const tagTotals = getTagTotals(purchases);
        const rankedTags = Object.entries(tagTotals).sort(
          (a, b) => b[1] - a[1],
        );

        const allMonths = Array.from(
          new Set([month, ...entries.map((entry) => entry.dayId.slice(0, 7))]),
        )
          .sort()
          .reverse();
        const pending = docs.filter((document) => document.seq === -1).length;

        function changeMonth(value: string) {
          if (!/^\d{4}-\d{2}$/.test(value) || !isValidDate(value + "-01")) {
            return;
          }

          setMonth(value);
          setSelected(value == today.slice(0, 7) ? today : value + "-01");
          setTagFilter("all");
        }

        function stepMonth(monthOffset: number) {
          changeMonth(
            getDateKey(new Date(year, mon + monthOffset, 1)).slice(0, 7),
          );
        }

        function selectDay(day: string) {
          setSelected(day);
          setSearch("");
          setFilter("all");
          setTagFilter("all");

          if (matchMedia("(max-width: 767px)").matches) setView("list");

          setScrollTarget(day);
        }

        const notify = (message: string) => setToast(message);

        function dayChanges(days: string[]) {
          return [...new Set(days)]
            .filter(Boolean)
            .map((day) => ({ id: "day:" + day, data: { id: day, date: day } }));
        }

        async function saveEntry(entry: Entry) {
          setBusy(true);

          try {
            const old = entries.find((candidate) => candidate.id === entry.id);
            const sameDay = entries.filter(
              (candidate) =>
                candidate.dayId === entry.dayId && candidate.id !== entry.id,
            );
            const saved = {
              ...entry,
              order:
                !old || old.dayId !== entry.dayId
                  ? Math.max(
                      -1,
                      ...sameDay.map((candidate) => candidate.order),
                    ) + 1
                  : old.order,
            };

            await backend.stage([
              ...dayChanges([entry.dayId]),
              { id: "entry:" + saved.id, data: saved },
            ]);

            setMonth(entry.dayId.slice(0, 7));
            setSelected(entry.dayId);
            setEditor(null);
            notify("기록을 저장했습니다.");
          } finally {
            setBusy(false);
          }
        }

        function deleteEntry(entry: Entry) {
          setConfirmation({
            title: "이 기록을 삭제할까요?",
            message: `${entry.title} · ${formatYen(entry.amount)} 기록이 삭제됩니다.`,
            action: async () => {
              await backend.stage([
                { id: "entry:" + entry.id, data: entry, del: true },
              ]);

              setEditor(null);
              notify("기록을 삭제했습니다.");
            },
          });
        }

        async function reorder(entry: Entry, direction: number) {
          const day = entries
            .filter((candidate) => candidate.dayId === entry.dayId)
            .sort(compareEntries);
          const index = day.findIndex((candidate) => candidate.id === entry.id);
          const target = index + direction;

          if (target < 0 || target >= day.length) return;

          [day[index], day[target]] = [day[target], day[index]];

          try {
            await backend.stage(
              day.map((dayEntry, index) => ({
                id: "entry:" + dayEntry.id,
                data: { ...dayEntry, order: index },
              })),
            );
          } catch (caughtError) {
            setError(
              "순서를 바꾸지 못했습니다: " + getErrorMessage(caughtError),
            );
          }
        }

        async function importEntries(
          incoming: Entry[],
          skipDuplicates: boolean,
        ) {
          setBusy(true);

          try {
            const existingEntryCounts = new Map<string, number>();
            const nextOrderByDay: Record<string, number> = {};
            const addedEntries: Entry[] = [];

            for (const entry of entries) {
              const fingerprint = getEntryFingerprint(entry);
              const count = existingEntryCounts.get(fingerprint) ?? 0;

              existingEntryCounts.set(fingerprint, count + 1);
              nextOrderByDay[entry.dayId] = Math.max(
                nextOrderByDay[entry.dayId] ?? -1,
                entry.order,
              );
            }

            for (const entry of incoming) {
              const fingerprint = getEntryFingerprint(entry);
              const existingCount = existingEntryCounts.get(fingerprint) ?? 0;

              if (skipDuplicates && existingCount > 0) {
                existingEntryCounts.set(fingerprint, existingCount - 1);
                continue;
              }

              const nextOrder = (nextOrderByDay[entry.dayId] ?? -1) + 1;
              nextOrderByDay[entry.dayId] = nextOrder;
              addedEntries.push({
                ...entry,
                id: createId(),
                order: nextOrder,
              });
            }

            await backend.stage([
              ...dayChanges(addedEntries.map((entry) => entry.dayId)),
              ...addedEntries.map((entry) => ({
                id: "entry:" + entry.id,
                data: entry,
              })),
            ]);

            if (addedEntries.length) {
              setMonth(addedEntries[0].dayId.slice(0, 7));
              setSelected(addedEntries[0].dayId);
            }

            setImportOpen(false);
            notify(
              `${addedEntries.length}건을 가져왔습니다.${incoming.length > addedEntries.length ? ` 중복 ${incoming.length - addedEntries.length}건 제외` : ""}`,
            );
          } finally {
            setBusy(false);
          }
        }

        function exportData() {
          const content = JSON.stringify(
            {
              app: "resito",
              version: 1,
              exportedAt: new Date().toISOString(),
              entries: [...entries].sort(
                (first, second) =>
                  first.dayId.localeCompare(second.dayId) ||
                  compareEntries(first, second),
              ),
            },
            null,
            2,
          );

          const url = URL.createObjectURL(
            new Blob([content], { type: "application/json" }),
          );
          const downloadLink = document.createElement("a");

          downloadLink.href = url;
          downloadLink.download = `resito-${today}.json`;
          downloadLink.click();

          setTimeout(() => URL.revokeObjectURL(url), 1000);
          notify("전체 기록을 내보냈습니다.");
        }

        function validateBackup(data: unknown): Entry[] {
          const result = backupSchema.safeParse(data);

          if (!result.success) {
            throw new Error("백업 파일에 올바르지 않은 기록이 있습니다.");
          }

          return result.data.entries.map((entry) => ({
            ...entry,
            items: entry.items.map((item) => ({ ...item, id: createId() })),
          }));
        }

        async function restoreFile(file?: File) {
          if (!file) return;

          try {
            const restored = validateBackup(JSON.parse(await file.text()));

            setConfirmation({
              title: "백업 기록을 가져올까요?",
              message: `${restored.length}건을 현재 저장소에 추가합니다. 동일한 기록은 건너뜁니다.`,
              action: () => importEntries(restored, true),
            });
          } catch (caughtError) {
            setError("백업을 읽지 못했습니다: " + getErrorMessage(caughtError));
          }
        }

        async function connectCloud() {
          if (syncing) return;

          setSyncing(true);
          setSettings(false);

          try {
            const { startClxDBWithUI } = await import("clxdb/ui");
            const next = new ReceiptBackend();
            const clxdb = await startClxDBWithUI({
              database: next,
              ui: {
                theme: "light",
                locale: "ko",
                style: { palette: { primaryColor: "#5262db" } },
                syncIndicator: true,
              },
            });

            if (!clxdb) {
              next.close();
              return;
            }

            unsubs.current.forEach((fn) => fn());
            client.current?.destroy();

            if (!next.db) {
              throw new Error("동기화 저장소를 초기화하지 못했습니다.");
            }

            backend.close();
            backend.db = next.db;
            backend.listeners = next.listeners; // 두 객체가 같은 Dexie와 알림 집합을 사용합니다.
            client.current = clxdb as ClxDBWithUI;

            const dbName = next.db.name.replace("resito_clxdb_", "");
            localStorage.setItem("resito-storage", dbName);
            setStorage(dbName);
            setCloud(true);
            setRevision((currentRevision) => currentRevision + 1);

            unsubs.current = [
              clxdb.on("syncComplete", () => {
                setRevision((currentRevision) => currentRevision + 1);
              }),
            ];

            notify("동기화 저장소에 연결했습니다.");
          } catch (caughtError) {
            setError(
              "저장소 연결에 실패했습니다: " + getErrorMessage(caughtError),
            );
          } finally {
            setSyncing(false);
          }
        }

        async function syncNow() {
          setSettings(false);
          setSyncing(true);

          try {
            const clxdb = client.current;

            if (!clxdb) {
              throw new Error("연결된 동기화 저장소가 없습니다.");
            }

            await clxdb.sync();
            notify("동기화가 완료되었습니다.");
          } catch (caughtError) {
            setError("동기화하지 못했습니다: " + getErrorMessage(caughtError));
          } finally {
            setSyncing(false);
          }
        }

        async function localStorageMode() {
          unsubs.current.forEach((fn) => fn());
          unsubs.current = [];
          client.current?.destroy();
          client.current = null;

          setReady(false);
          await backend.initialize("local");

          localStorage.setItem("resito-storage", "local");
          setStorage("local");
          setCloud(false);
          setDocs([]);
          setRevision((currentRevision) => currentRevision + 1);
          setReady(true);
          setSettings(false);

          notify("이 브라우저의 로컬 저장소를 열었습니다.");
        }

        return (
          <div className="min-h-screen pb-24 md:pb-8">
            <header className="bg-white border-b border-[#e9ecf2] sticky top-0 z-30">
              <div className="max-w-[1300px] mx-auto h-[76px] px-5 sm:px-8 flex items-center justify-between gap-4">
                <a
                  href="#"
                  onClick={(e) => {
                    e.preventDefault();
                    setView("calendar");
                  }}
                  className="flex items-center gap-2.5 no-underline text-inherit"
                >
                  <div className="h-9 w-9 bg-brand rounded-[11px] text-white flex items-center justify-center shadow-sm">
                    <ReceiptText size={21} strokeWidth={1.7} />
                  </div>
                  <span className="text-[23px] font-extrabold tracking-[-1px]">
                    resi<span className="text-brand">.to</span>
                  </span>
                  <span className="hidden lg:block ml-4 pl-5 border-l border-slate-200 text-[11px] text-slate-400">
                    나의 일상을 담는 영수증
                  </span>
                </a>
                <nav
                  aria-label="주 메뉴"
                  className="hidden md:flex gap-1 h-full items-center"
                >
                  {TOP_NAVIGATION.map(
                    ({ view: navigationView, label, icon: Icon }) => (
                      <button
                        key={navigationView}
                        onClick={() => setView(navigationView)}
                        className={cn(
                          "flex items-center gap-2 px-5 h-full border-b-2 text-xs font-semibold",
                          view === navigationView ||
                            (view === "list" && navigationView === "calendar")
                            ? "border-brand text-brand"
                            : "border-transparent text-slate-400",
                        )}
                      >
                        <Icon size={15} />
                        {label}
                      </button>
                    ),
                  )}
                </nav>
                <div className="flex items-center gap-2 sm:gap-3">
                  <div className="relative">
                    <button
                      className="flex items-center gap-1.5 text-[11px] text-slate-400 p-2 rounded-lg hover:bg-slate-50"
                      onClick={() => setSettings(!settings)}
                      aria-expanded={settings}
                      aria-label="저장소 및 백업 설정"
                    >
                      <span
                        className={cn(
                          "w-1.5 h-1.5 rounded-full",
                          cloud ? "bg-emerald-400" : "bg-slate-300",
                        )}
                      />
                      <span className="hidden sm:inline">
                        {cloud
                          ? "클라우드 연결됨"
                          : storage && storage !== "local"
                            ? "저장소 연결 필요"
                            : "로컬 저장소"}
                      </span>
                      <Cloud size={15} />
                    </button>
                    {settings && (
                      <>
                        <div
                          className="fixed inset-0 z-30"
                          onClick={() => setSettings(false)}
                        />
                        <div className="absolute right-0 top-11 z-40 w-64 panel shadow-xl p-2">
                          <div className="px-3 py-3 border-b border-slate-100 mb-1">
                            <p className="font-semibold text-xs">
                              저장소와 백업
                            </p>
                            <p className="text-[10px] muted mt-1">
                              {cloud
                                ? `동기화 대기 ${pending}건`
                                : "기록은 현재 브라우저에 자동 저장됩니다."}
                            </p>
                          </div>
                          {cloud ? (
                            <button
                              className="flex gap-2 items-center p-3 text-xs w-full hover:bg-slate-50 rounded-lg"
                              onClick={syncNow}
                              disabled={syncing}
                            >
                              <FolderSync size={15} />
                              지금 동기화
                            </button>
                          ) : (
                            <button
                              className="flex gap-2 items-center p-3 text-xs w-full hover:bg-slate-50 rounded-lg"
                              onClick={connectCloud}
                              disabled={syncing}
                            >
                              <Cloud size={15} />
                              clxdb 저장소 연결
                            </button>
                          )}
                          <button
                            className="flex gap-2 items-center p-3 text-xs w-full hover:bg-slate-50 rounded-lg"
                            onClick={() => {
                              exportData();
                              setSettings(false);
                            }}
                          >
                            <Download size={15} />
                            전체 기록 백업 (JSON)
                          </button>
                          <label className="flex gap-2 items-center p-3 text-xs w-full hover:bg-slate-50 rounded-lg cursor-pointer font-normal mb-0 text-inherit">
                            <Upload size={15} />
                            백업 가져오기
                            <input
                              type="file"
                              accept=".json,application/json"
                              className="hidden"
                              onChange={(e) => {
                                restoreFile(e.target.files?.[0]);
                                setSettings(false);
                                e.target.value = "";
                              }}
                            />
                          </label>
                          {storage !== "local" && (
                            <button
                              className="flex gap-2 items-center p-3 text-xs w-full hover:bg-slate-50 rounded-lg"
                              onClick={() =>
                                localStorageMode().catch((caughtError) =>
                                  setError(getErrorMessage(caughtError)),
                                )
                              }
                            >
                              <Wallet size={15} />
                              로컬 저장소 열기
                            </button>
                          )}
                          <p className="text-[10px] text-slate-400 leading-5 px-3 pt-2 pb-1 border-t border-slate-100">
                            연결 시 선택한 저장소의 기록이 표시됩니다. 로컬
                            기록은 JSON 백업으로 옮길 수 있어요.
                          </p>
                        </div>
                      </>
                    )}
                  </div>
                  <button
                    className="btn hidden sm:inline-flex"
                    onClick={() => setImportOpen(true)}
                    disabled={!ready}
                  >
                    <Upload size={13} />
                    텍스트 가져오기
                  </button>
                  <button
                    className="btn primary"
                    onClick={() =>
                      setEditor({ entry: blankEntry(selected), isNew: true })
                    }
                    disabled={!ready}
                  >
                    <Plus size={15} />
                    <span className="hidden sm:inline">기록 추가</span>
                  </button>
                </div>
              </div>
            </header>

            <main className="max-w-[1240px] mx-auto px-4 sm:px-7 pt-7 sm:pt-9">
              {error && (
                <div
                  role="alert"
                  className="flex gap-3 items-center justify-between bg-red-50 border border-red-100 rounded-xl p-4 text-xs text-red-500 mb-5"
                >
                  <span>{error}</span>
                  <IconButton label="오류 닫기" onClick={() => setError("")}>
                    <X size={15} />
                  </IconButton>
                </div>
              )}
              <div className="flex items-center justify-between mb-6">
                <div>
                  <div className="flex items-center gap-3">
                    <h1 className="text-[23px] sm:text-[26px] font-bold tracking-tight">
                      {view === "stats" ? "지출 한눈에 보기" : "나의 영수증"}
                    </h1>
                    <span className="hidden sm:inline-block text-[10px] tracking-[.06em] font-semibold text-brand bg-[#eaeefa] px-2 py-1 rounded-md">
                      MY RECEIPTS
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 mt-2">
                    {view === "stats"
                      ? "기록이 모여 나만의 소비 패턴이 됩니다."
                      : "작은 소비도 놓치지 않도록, 하루하루 차곡차곡."}
                  </p>
                </div>
                <button
                  onClick={() => {
                    changeMonth(today.slice(0, 7));
                    if (view !== "stats") selectDay(today);
                  }}
                  className="btn !py-2 !px-3 text-[11px]"
                >
                  <CalendarDays size={13} />
                  오늘
                </button>
              </div>
              <div className="flex items-center gap-2 mb-5">
                <IconButton label="이전 달" onClick={() => stepMonth(-1)}>
                  <ChevronLeft size={17} />
                </IconButton>
                <h2 className="text-[19px] font-bold tracking-tight min-w-[118px] text-center">
                  {year}년 {mon + 1}월
                </h2>
                <IconButton label="다음 달" onClick={() => stepMonth(1)}>
                  <ChevronRight size={17} />
                </IconButton>
                <label className="relative ml-1 mb-0">
                  <span className="sr-only">표시할 월 선택</span>
                  <input
                    type="month"
                    value={month}
                    onChange={(e) => changeMonth(e.target.value)}
                    className="!w-[23px] !h-[25px] !p-0 opacity-0 absolute inset-0 cursor-pointer"
                  />
                  <CalendarDays size={14} className="text-slate-400" />
                </label>
                <div className="ml-auto text-[11px] text-slate-400 hidden sm:block">
                  {new Set(monthEntries.map((entry) => entry.dayId)).size}일의
                  기록 <span className="mx-2 text-slate-200">/</span> 총{" "}
                  {monthEntries.length}건
                </div>
              </div>
              <section
                aria-label="월별 지출 요약"
                className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-7"
              >
                <div className="rounded-2xl bg-brand text-white p-5 relative overflow-hidden min-h-[140px]">
                  <div className="absolute -right-5 -bottom-8 w-32 h-32 border-[20px] border-white/5 rounded-full" />
                  <p className="text-[11px] text-indigo-100 flex items-center gap-2">
                    <Wallet size={14} className="text-indigo-200" />
                    이번 달 총 지출
                  </p>
                  <p className="text-[28px] sm:text-[30px] font-bold num mt-4 leading-none">
                    {formatYen(monthTotal)}
                  </p>
                  <p className="text-[10px] text-indigo-200 mt-3">
                    이체 · 합계 제외 내역 미포함
                  </p>
                </div>
                <SummaryCard
                  label="일평균 지출"
                  value={formatYen(Math.round(monthTotal / (activeDays || 1)))}
                  note={`${activeDays}일의 결제 기록 기준`}
                  icon={CalendarDays}
                  color="#719dd3"
                />
                <SummaryCard
                  label="이번 달 결제"
                  value={

            )}
            {editor && (
              <EntryEditor
                entry={editor.entry}
                isNew={editor.isNew}
                onClose={() => setEditor(null)}
                onSave={saveEntry}
                onDelete={deleteEntry}
                busy={busy}
              />
            )}
            {importOpen && (
              <ImportDialog
                onClose={() => setImportOpen(false)}
                onImport={importEntries}
                busy={busy}
              />
            )}
            {confirmation && (
              <Modal
                title={confirmation.title}
                onClose={() => !busy && setConfirmation(null)}
              >
                <p className="text-sm text-slate-500 leading-7">
                  {confirmation.message}
                </p>
                <div className="flex justify-end gap-2 mt-6">
                  <button
                    className="btn"
                    disabled={busy}
                    onClick={() => setConfirmation(null)}
                  >
                    취소
                  </button>
                  <button
                    className="btn primary"
                    disabled={busy}
                    onClick={async () => {
                      setBusy(true);
                      try {
                        await confirmation.action();
                        setConfirmation(null);
                      } catch (caughtError) {
                        setError(getErrorMessage(caughtError));
                        setConfirmation(null);
                      } finally {
                        setBusy(false);
                      }
                    }}
                  >
                    확인
                  </button>
                </div>
              </Modal>
            )}
          </div>
        );
      }

      type SummaryCardProps = {
        label: string;
        value: React.ReactNode;
        note: string;
        icon: React.ElementType;
        color: string;
      };

      function SummaryCard({
        label,
        value,
        note,
        icon: Icon,
        color,
      }: SummaryCardProps) {
        return (
          <div className="panel p-5 min-h-[140px]">
            <p className="text-[11px] text-slate-400 flex justify-between items-center">
              {label}
              <Icon size={15} style={{ color }} strokeWidth={1.7} />
            </p>
            <p className="num text-[26px] sm:text-[29px] font-bold mt-4 leading-none">
              {value}
            </p>
            <p className="text-[10px] text-slate-400 mt-3">{note}</p>
          </div>
        );
      }
      function Empty({ text }: { text: string }) {
        return (
          <div className="text-center text-xs text-slate-400 py-12 leading-6">
            <ChartNoAxesCombined
              size={26}
              className="mx-auto mb-3 text-slate-300"
            />
            {text}
          </div>
        );
      }
      type EntryCardProps = {
        entry: Entry;
        onEdit: () => void;
        onReorder: (entry: Entry, direction: number) => Promise<void>;
        first: boolean;
        last: boolean;
      };

      function EntryCard({
        entry,
        onEdit,
        onReorder,
        first,
        last,
      }: EntryCardProps) {
        const isTransfer = entry.type === "transfer";
        return (
          <article
            className={cn(
              "entry-card panel !rounded-xl px-4 sm:px-5 py-4",
              entry.excluded && "opacity-65",
            )}
          >
            <div className="flex items-start gap-3">
              <span
                className={cn(
                  "w-9 h-9 rounded-xl flex items-center justify-center shrink-0",
                  isTransfer
                    ? "bg-[#eef3f9] text-[#8a9db6]"
                    : "bg-[#f0f2fc] text-[#8490d4]",
                )}
              >
                {isTransfer ? (
                  <ArrowDownUp size={18} strokeWidth={1.7} />
                ) : (
                  <ReceiptText size={18} strokeWidth={1.7} />
                )}
              </span>
              <div className="min-w-0 flex-1">
                <div className="flex items-start justify-between gap-2">
                  <button onClick={onEdit} className="text-left min-w-0">
                    <h5 className="text-[13px] font-semibold leading-5 break-words">
                      {entry.title}{" "}
                      {entry.merchant && (
                        <span className="text-[11px] font-normal text-slate-400 ml-1">
                          {entry.merchant}
                        </span>
                      )}
                    </h5>
                  </button>
                  <span
                    className={cn(
                      "text-[15px] num font-bold whitespace-nowrap leading-5",
                      entry.excluded
                        ? "text-slate-400"
                        : isTransfer && "text-[#7a8da6]",
                    )}
                  >
                    {formatYen(entry.amount)}
                  </span>
                </div>
                <div className="flex flex-wrap gap-1.5 mt-2 items-center">
                  <PaymentBadge id={entry.paymentMethod} />
                  {isTransfer && (
                    <>
                      <ArrowRight size={11} className="text-slate-400" />
                      <PaymentBadge id={entry.toMethod} />
                      <span className="pill bg-slate-100 text-slate-400">
                        이체
                      </span>
                    </>
                  )}
                  {entry.excluded && (
                    <span className="pill bg-slate-100 text-slate-400">
                      합계 제외
                    </span>
                  )}
                  {entry.tags.map((tag) => (
                    <span
                      key={tag}
                      className="text-[10px] text-slate-400 ml-0.5"
                    >
                      #{tag}
                    </span>
                  ))}
                </div>
                {entry.items.length > 0 && (
                  <ul className="mt-3 space-y-1.5 border-l border-slate-200 pl-3 list-none">
                    {entry.items.map((item) => (
                      <li
                        key={item.id}
                        className="text-[11px] text-slate-500 leading-5 break-words"
                      >
                        {item.name}
                        {item.detail && (
                          <span className="text-slate-400 ml-1">
                            ({item.detail})
                          </span>
                        )}
                      </li>
                    ))}
                  </ul>
                )}
                {entry.memo && (
                  <p className="text-[11px] text-slate-400 leading-5 mt-2 whitespace-pre-wrap break-words">
                    {entry.memo}
                  </p>
                )}
              </div>
            </div>
            <div className="flex justify-end mt-1 -mb-1 -mr-1">
              <IconButton
                label="위로 이동"
                disabled={first}
                onClick={() => onReorder(entry, -1)}
              >
                <ArrowUp size={12} />
              </IconButton>
              <IconButton
                label="아래로 이동"
                disabled={last}
                onClick={() => onReorder(entry, 1)}
              >
                <ArrowDown size={12} />
              </IconButton>
              <IconButton label="기록 수정" onClick={onEdit}>
                <Pencil size={12} />
              </IconButton>
            </div>
          </article>
        );
      }

      createRoot(document.getElementById("root")!).render(<App />);
    </script>
    <script type="module" src="https://esm.sh/tsx"></script>
  </body>
</html>
